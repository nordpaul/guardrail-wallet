<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Guardrail Wallet / AI Payment Firewall</title>
  <desc id="desc">Self-hosted payment controls for AI agents, with a strict non-overlapping two-column layout.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3efdf"/>
      <stop offset="100%" stop-color="#e6dfca"/>
    </linearGradient>
    <linearGradient id="policy-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9ff45"/>
      <stop offset="100%" stop-color="#f2b73f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172019" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <rect x="46" y="34" width="1516" height="560" rx="24" fill="#172019" opacity="0.16"/>
  <rect x="42" y="30" width="1516" height="560" rx="24" fill="none" stroke="#172019" stroke-width="2"/>
  <rect x="58" y="52" width="1484" height="526" rx="20" fill="#f7f4e7" fill-opacity="0.96" stroke="#172019" stroke-width="2"/>

  <g id="banner-header">
    <rect x="82" y="82" width="1436" height="58" rx="14" fill="#fffdf5" stroke="#172019" stroke-width="2"/>
    <rect x="82" y="82" width="14" height="58" rx="7" fill="#172019"/>
    <text x="108" y="124" font-family="Syne, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="900" fill="#172019" letter-spacing="2">GUARDRAIL WALLET</text>
    <rect x="1284" y="97" width="220" height="28" rx="14" fill="#c9ff45" stroke="#172019" stroke-width="1"/>
    <text x="1299" y="117" font-family="Syne, Arial, sans-serif" font-size="12" font-weight="700" fill="#172019" letter-spacing="1">AI PAYMENT FIREWALL</text>
  </g>

  <g id="banner-copy">
    <text x="82" y="226" textLength="650" lengthAdjust="spacingAndGlyphs" font-family="Syne, Arial, sans-serif" font-size="76" font-weight="900" fill="#172019">PAYMENTS WITH</text>
    <text x="82" y="306" textLength="590" lengthAdjust="spacingAndGlyphs" font-family="Syne, Arial, sans-serif" font-size="76" font-weight="900" fill="#172019">GUARDRAILS.</text>
    <text x="82" y="356" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#556057">Self-hosted payment policy for AI agents.</text>
    <text x="82" y="390" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#556057">Human approval. Your keys stay home.</text>
    <rect x="82" y="406" width="344" height="38" rx="8" fill="#172019"/>
    <text x="104" y="432" font-family="Syne, Arial, sans-serif" font-size="14" font-weight="800" fill="#fffdf5" letter-spacing="1">REQUEST / POLICY / EXECUTE</text>
  </g>

  <g id="banner-panel">
    <rect x="820" y="170" width="680" height="270" rx="20" fill="#172019" stroke="#111111" stroke-width="2"/>
    <rect x="836" y="186" width="648" height="50" rx="12" fill="#f3efdf"/>
    <text x="858" y="219" font-family="Syne, Arial, sans-serif" font-size="23" font-weight="800" fill="#172019">CONTROL PANEL</text>

    <g id="banner-panel-steps">
      <rect x="836" y="252" width="196" height="48" rx="10" fill="#c9ff45"/>
      <rect x="1042" y="252" width="196" height="48" rx="10" fill="#ece7d4"/>
      <rect x="1248" y="252" width="236" height="48" rx="10" fill="#f0643b"/>
      <text x="856" y="282" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700" fill="#172019">01 REQUEST</text>
      <text x="1062" y="282" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700" fill="#172019">02 POLICY</text>
      <text x="1268" y="282" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700" fill="#fffdf5">03 OWNER APPROVAL</text>
    </g>

    <g id="banner-panel-policy">
      <rect x="836" y="318" width="648" height="44" rx="10" fill="url(#policy-stripe)"/>
      <text x="858" y="347" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#172019">SAFE DEFAULT: DENY UNKNOWN CATEGORIES</text>
    </g>

    <g id="banner-panel-executor">
      <rect x="836" y="380" width="648" height="40" rx="9" fill="#2a2f3f"/>
      <text x="858" y="406" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="700" fill="#fffdf5">DEMO EXECUTOR = STUB / NO REAL MONEY</text>
    </g>
  </g>

  <g id="banner-footer">
    <rect x="84" y="470" width="1472" height="86" rx="12" fill="#111111" opacity="0.94"/>
    <line x1="360" y1="486" x2="360" y2="540" stroke="#556057"/>
    <line x1="720" y1="486" x2="720" y2="540" stroke="#556057"/>
    <line x1="1080" y1="486" x2="1080" y2="540" stroke="#556057"/>
    <text x="108" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="700" fill="#c9ff45">01 / REQUEST</text>
    <text x="108" y="534" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#fffdf5">Agent asks, never spends directly</text>
    <text x="388" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="700" fill="#c9ff45">02 / CHECK</text>
    <text x="388" y="534" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#fffdf5">Policy checks every decision</text>
    <text x="748" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="700" fill="#c9ff45">03 / APPROVE</text>
    <text x="748" y="534" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#fffdf5">Owner controls critical flows</text>
    <text x="1108" y="508" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0643b">LIVE DEMO</text>
    <text x="1108" y="534" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#fffdf5">patronhill.ru</text>
  </g>
</svg>
