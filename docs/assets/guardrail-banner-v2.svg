<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Guardrail Wallet · AI Payment Firewall</title>
  <desc id="desc">High-contrast marketing hero aligned to Guardrail Wallet visual language.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3efdf"/>
      <stop offset="100%" stop-color="#e6dfca"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9ff45"/>
      <stop offset="100%" stop-color="#f0643b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172019" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#172019" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <rect x="42" y="30" width="1516" height="560" rx="24" fill="none" stroke="#172019" stroke-width="2"/>
  <rect x="58" y="52" width="1484" height="526" rx="20" fill="#f7f4e7" fill-opacity="0.95" stroke="#172019" stroke-width="2"/>

  <g>
    <rect x="82" y="82" width="1460" height="58" rx="14" fill="#fffdf5" stroke="#172019" stroke-width="2"/>
    <rect x="82" y="82" width="14" height="58" rx="7" fill="#172019"/>
    <text x="108" y="124" font-family="Syne, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="900" fill="#172019" letter-spacing="2">GUARDRAIL WALLET</text>
    <rect x="1308" y="97" width="220" height="28" rx="14" fill="#c9ff45" stroke="#172019" stroke-width="1"/>
    <text x="1323" y="117" font-family="Syne, Arial, sans-serif" font-size="12" font-weight="700" fill="#172019" letter-spacing="1">AI PAYMENT FIREWALL</text>
  </g>

  <text x="82" y="204" font-family="Syne, Arial, sans-serif" font-size="86" font-weight="900" fill="#172019" letter-spacing="-2">PAYMENTS WITH</text>
  <text x="82" y="296" font-family="Syne, Arial, sans-serif" font-size="86" font-weight="900" fill="#172019" letter-spacing="-2">GUARDRAILS.</text>
  <text x="82" y="364" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="700" fill="#556057">Self-hosted policy engine · Human approval · One narrow API.</text>

  <rect x="82" y="386" width="180" height="44" fill="#172019"/>
  <text x="110" y="416" font-family="Syne, Arial, sans-serif" font-size="14" font-weight="700" fill="#fffdf5">REQUEST · POLICY · EXECUTE</text>

  <g transform="translate(860 150)">
    <rect x="0" y="0" width="640" height="250" rx="20" fill="#172019" stroke="#111" stroke-width="2"/>
    <rect x="16" y="16" width="608" height="58" rx="12" fill="#f3efdf"/>
    <text x="36" y="52" font-family="Syne, Arial, sans-serif" font-size="24" font-weight="800" fill="#172019">CONTROL PANEL</text>

    <rect x="16" y="88" width="184" height="56" rx="12" fill="#c9ff45"/>
    <rect x="212" y="88" width="184" height="56" rx="12" fill="#ece7d4" stroke="#172019" stroke-width="1"/>
    <rect x="408" y="88" width="216" height="56" rx="12" fill="#f0643b"/>

    <text x="52" y="124" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700" fill="#172019">01 REQUEST</text>
    <text x="224" y="124" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700" fill="#172019">02 POLICY</text>
    <text x="424" y="124" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700" fill="#fffdf5">03 OWNER</text>

    <g transform="translate(70 166)">
      <rect x="0" y="0" width="500" height="58" rx="10" fill="url(#stripe)"/>
      <text x="18" y="36" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="700" fill="#172019">safe defaults: deny unknown categories</text>
    </g>
    <rect x="24" y="206" width="592" height="22" fill="#f3efdf"/>
    <rect x="24" y="236" width="592" height="22" fill="#d7d0bb"/>
    <g transform="translate(40 206)">
      <rect x="0" y="0" width="560" height="52" rx="8" fill="#111" fill-opacity="0.5"/>
      <text x="18" y="33" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="700" fill="#fffdf5">DEMO EXECUTOR = STUB (no real money)</text>
    </g>
  </g>

  <g filter="url(#drop)" transform="translate(84 470)">
    <rect x="0" y="0" width="1472" height="86" rx="12" fill="#111" fill-opacity="0.88"/>
    <text x="20" y="33" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" fill="#c9ff45" font-weight="700">Key ideas</text>
    <text x="120" y="33" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" fill="#fff" font-weight="700">Agent can request</text>
    <text x="370" y="33" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" fill="#fff" font-weight="700">Owner approves critical flows</text>
    <text x="760" y="33" font-family="Trebuchet MS, Arial, sans-serif" font-size="16" fill="#fff" font-weight="700">Policy logs every decision</text>
    <text x="20" y="63" font-family="Trebuchet MS, Arial, sans-serif" font-size="13" fill="#f3efdf">patronhill.ru</text>
    <line x1="360" y1="21" x2="360" y2="65" stroke="#2a2f3f"/>
    <line x1="700" y1="21" x2="700" y2="65" stroke="#2a2f3f"/>
    <line x1="1060" y1="21" x2="1060" y2="65" stroke="#2a2f3f"/>
  </g>
</svg>
