<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Guardrail Wallet</title>
  <desc id="desc">Guardrail Wallet — self-hosted AI payment firewall with human approval and policy controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)" />
  <rect x="52" y="52" width="1496" height="516" rx="24" fill="#0b1220" fill-opacity="0.75" />
  <rect x="52" y="52" width="1496" height="8" rx="4" fill="url(#line)" />

  <g transform="translate(90 110)" fill="#e5e7eb" filter="url(#shadow)">
    <text x="0" y="0" font-size="68" font-weight="800" font-family="Inter, 'Segoe UI', Arial, sans-serif">Guardrail Wallet</text>
    <text x="4" y="78" font-size="36" font-weight="500" font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#9ca3af">Self-hosted payment firewall for AI agents</text>
  </g>

  <g transform="translate(90 236)" fill="#d1d5db" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32">
    <text x="0" y="0">• Request → Policy → Owner approval → Execution boundary</text>
    <text x="0" y="54">• No agent can spend without explicit owner-approved controls</text>
    <text x="0" y="108">• Built for smart homes, side projects, and micro-business budgets</text>
  </g>

  <g transform="translate(90 490)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="0" y="-30" width="420" height="78" rx="18" fill="#16a34a"/>
    <text x="38" y="20" font-size="34" fill="#f9fafb" font-weight="700">Self-hosted</text>
    <text x="38" y="55" font-size="22" fill="#dcfce7">Agent-first security</text>
    <rect x="470" y="-30" width="420" height="78" rx="18" fill="#2563eb"/>
    <text x="508" y="20" font-size="34" fill="#f9fafb" font-weight="700">Demo-friendly</text>
    <text x="508" y="55" font-size="22" fill="#dbeafe">No real funds on hosted demo</text>
    <rect x="840" y="-30" width="420" height="78" rx="18" fill="#0ea5e9"/>
    <text x="870" y="20" font-size="34" fill="#f9fafb" font-weight="700">Built for trust</text>
    <text x="870" y="55" font-size="22" fill="#e0f2fe">Policies, logs, approvals</text>
  </g>

  <g transform="translate(90 56)" font-size="14" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="1360" y="8" width="186" height="26" rx="12" fill="#111827" stroke="#22c55e" opacity="0.7" />
    <text x="1370" y="26" fill="#6ee7b7">LIVE DEMO • https://patronhill.ru</text>
  </g>
</svg>
