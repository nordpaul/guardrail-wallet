<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Support Guardrail Wallet</title>
  <desc id="desc">Support card with separated copy, benefits, address, and footer areas.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f3efdf" stroke-width="0.8" stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1400" height="430" fill="#f0643b"/>
  <rect width="1400" height="430" fill="url(#grid)"/>
  <rect x="52" y="48" width="1308" height="346" rx="26" fill="#172019" opacity="0.25"/>
  <rect x="46" y="42" width="1308" height="346" rx="26" fill="#172019" stroke="#f3efdf" stroke-width="2"/>
  <rect x="66" y="62" width="1268" height="306" rx="20" fill="#fffdf5" stroke="#172019" stroke-width="2"/>

  <g id="donate-copy">
    <text x="102" y="112" font-family="Syne, Arial, sans-serif" font-size="22" font-weight="900" fill="#f0643b" letter-spacing="1">SUPPORT THE PROJECT</text>
    <text x="102" y="170" textLength="520" lengthAdjust="spacingAndGlyphs" font-family="Syne, Arial, sans-serif" font-size="58" font-weight="900" fill="#172019">KEEP GUARDRAIL</text>
    <text x="102" y="226" textLength="205" lengthAdjust="spacingAndGlyphs" font-family="Syne, Arial, sans-serif" font-size="58" font-weight="900" fill="#172019">ALIVE.</text>
    <rect x="102" y="246" width="292" height="44" rx="10" fill="#c9ff45" stroke="#172019" stroke-width="2"/>
    <text x="126" y="275" font-family="Syne, Arial, sans-serif" font-size="16" font-weight="800" fill="#172019">TON SUPPORT ADDRESS</text>
    <rect x="102" y="306" width="520" height="30" rx="5" fill="#172019"/>
    <text x="116" y="327" textLength="488" lengthAdjust="spacingAndGlyphs" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" fill="#fffdf5">UQCLbq0UGD65ljHQGlqF5pNgMAWDgE_bnavRxSSRZy-V3rEJ</text>
  </g>

  <g id="donate-panel">
    <rect x="720" y="92" width="580" height="220" rx="18" fill="#172019" stroke="#f0643b" stroke-width="2"/>
    <rect x="740" y="112" width="540" height="48" rx="10" fill="#f3efdf"/>
    <text x="760" y="144" font-family="Syne, Arial, sans-serif" font-size="23" font-weight="800" fill="#172019">WHAT YOUR SUPPORT BUILDS</text>

    <rect x="740" y="176" width="540" height="34" rx="8" fill="#2a2f3f"/>
    <text x="758" y="199" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" fill="#fffdf5">01 / Security hardening and audit-ready logs</text>
    <rect x="740" y="220" width="540" height="34" rx="8" fill="#2a2f3f"/>
    <text x="758" y="243" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" fill="#fffdf5">02 / Documentation, examples, and support</text>
    <rect x="740" y="264" width="540" height="34" rx="8" fill="#2a2f3f"/>
    <text x="758" y="287" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" fill="#fffdf5">03 / Household payment workflow features</text>
  </g>

  <g id="donate-footer">
    <rect x="102" y="340" width="1198" height="18" rx="5" fill="#172019"/>
    <rect x="102" y="340" width="170" height="18" rx="5" fill="#f0643b"/>
  </g>
</svg>
