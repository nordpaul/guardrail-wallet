<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Support Guardrail Wallet</title>
  <desc id="desc">Support card for Guardrail Wallet donation.</desc>
  <defs>
    <linearGradient id="don" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1400" height="380" fill="url(#don)" />
  <rect x="48" y="40" width="1304" height="300" rx="24" fill="#111827" fill-opacity="0.95" />
  <rect x="48" y="40" width="1304" height="8" fill="#06b6d4" />

  <text x="96" y="118" fill="#f1f5f9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800">Support this project</text>
  <text x="96" y="165" fill="#94a3b8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24">Open-source project, no AI agent gets</text>
  <text x="96" y="198" fill="#94a3b8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24">owner-level keys or private money access.</text>
  <text x="96" y="235" fill="#94a3b8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24">Your support keeps Guardrail Wallet safe.</text>

  <rect x="96" y="230" width="340" height="82" rx="18" fill="#06b6d4" />
  <text x="152" y="287" fill="#082f49" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800">TON support wallet</text>

  <text x="96" y="330" fill="#64748b" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22">Donations fund support, docs, audits,</text>
  <text x="96" y="354" fill="#64748b" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22">and deployment hardening.</text>
</svg>
